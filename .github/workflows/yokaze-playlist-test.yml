name: YoKaze Playlist Test

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "執行模式：先用 dry-run 驗證，確認後才選 production"
        required: true
        type: choice
        options:
          - dry-run
          - production
        default: dry-run
      source_playlist_id:
        description: "來源播放清單 ID"
        required: true
        type: string
        default: "PLvoJm-S4aIsyku-i5SCMlYd5mcQqzh3FK"
      artcore_playlist_id:
        description: "Artcore 目標播放清單 ID"
        required: true
        type: string
        default: "PL270BslqsyEAcdGgTUGm3IYaJ7OtJmsfR"
      sample_size:
        description: "隨機測試影片數量（1–5）"
        required: true
        type: string
        default: "3"
      other_playlist_title:
        description: "非 Artcore 測試播放清單名稱"
        required: true
        type: string
        default: "YoKaze｜其他曲風（測試）"

permissions:
  contents: read

concurrency:
  group: yokaze-playlist-test
  cancel-in-progress: false

jobs:
  classify-and-route:
    name: Sample, classify, and route videos
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MODE: ${{ inputs.mode }}
      SOURCE_PLAYLIST_ID: ${{ inputs.source_playlist_id }}
      ARTCORE_PLAYLIST_ID: ${{ inputs.artcore_playlist_id }}
      SAMPLE_SIZE: ${{ inputs.sample_size }}
      OTHER_PLAYLIST_TITLE: ${{ inputs.other_playlist_title }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.8-flash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade google-api-python-client google-auth google-genai

      - name: Sample, classify, and route
        run: |
          python - <<'PY'
          import json
          import os
          import random
          import time

          from google import genai
          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from google.genai import errors, types

          YOUTUBE_SCOPE = "https://www.googleapis.com/auth/youtube.force-ssl"
          ALLOWED_GENRES = {
              "J-pop",
              "R&B",
              "Artcore",
              "Pop",
              "Rock",
              "Electronic",
              "Hip-hop",
              "Jazz",
              "Classical",
              "Other/Uncertain",
          }

          def required_env(name):
              value = os.environ.get(name, "").strip()
              if not value:
                  raise RuntimeError(f"Missing required GitHub secret or setting: {name}")
              return value

          def parse_sample_size():
              try:
                  value = int(required_env("SAMPLE_SIZE"))
              except ValueError as exc:
                  raise RuntimeError("SAMPLE_SIZE must be an integer from 1 to 5") from exc
              if not 1 <= value <= 5:
                  raise RuntimeError("SAMPLE_SIZE must be from 1 to 5")
              return value

          def build_youtube_client():
              credentials = Credentials(
                  token=None,
                  refresh_token=required_env("YOUTUBE_REFRESH_TOKEN"),
                  token_uri="https://oauth2.googleapis.com/token",
                  client_id=required_env("YOUTUBE_CLIENT_ID"),
                  client_secret=required_env("YOUTUBE_CLIENT_SECRET"),
                  scopes=[YOUTUBE_SCOPE],
              )
              credentials.refresh(Request())
              return build("youtube", "v3", credentials=credentials, cache_discovery=False)

          def load_source_items(youtube, playlist_id):
              items = []
              next_page_token = None
              max_source_items = 1000

              while True:
                  response = youtube.playlistItems().list(
                      part="snippet,contentDetails",
                      playlistId=playlist_id,
                      maxResults=50,
                      pageToken=next_page_token,
                  ).execute()
                  items.extend(response.get("items", []))

                  if len(items) >= max_source_items:
                      print(f"Source playlist scan capped at {max_source_items} items.")
                      break

                  next_page_token = response.get("nextPageToken")
                  if not next_page_token:
                      break

              candidates = {}
              for item in items:
                  snippet = item.get("snippet", {})
                  content_details = item.get("contentDetails", {})
                  video_id = content_details.get("videoId")
                  if not video_id:
                      video_id = snippet.get("resourceId", {}).get("videoId")
                  if not video_id or video_id in candidates:
                      continue

                  title = snippet.get("title", "(untitled)")
                  if title in {"Private video", "Deleted video"}:
                      continue

                  candidates[video_id] = {
                      "video_id": video_id,
                      "title": title,
                      "published_at": snippet.get("publishedAt", "unknown"),
                      "url": f"https://www.youtube.com/watch?v={video_id}",
                  }

              return list(candidates.values())

          def validate_playlist(youtube, playlist_id, label):
              response = youtube.playlists().list(
                  part="snippet,status",
                  id=playlist_id,
                  maxResults=1,
              ).execute()
              items = response.get("items", [])
              if not items:
                  raise RuntimeError(f"Could not access {label} playlist: {playlist_id}")
              item = items[0]
              title = item.get("snippet", {}).get("title", "(untitled)")
              privacy = item.get("status", {}).get("privacyStatus", "unknown")
              print(f"{label} playlist: {title} [{privacy}] ({playlist_id})")
              return item

          def is_video_in_playlist(youtube, playlist_id, video_id):
              response = youtube.playlistItems().list(
                  part="id",
                  playlistId=playlist_id,
                  videoId=video_id,
                  maxResults=1,
              ).execute()
              return bool(response.get("items"))

          def classify_video(gemini, candidate):
              prompt = f"""
          Classify the music in this public YouTube video for a personal playlist.
          Use the supplied video and its title as evidence. Analyze the audible music
          when available, but do not invent details that cannot be supported.
          Select exactly one primary_genre from the allowed values.
          A cover, remix, live performance, or music video is a format, not necessarily a genre.
          Use Other/Uncertain and a lower confidence when evidence is insufficient.
          Return JSON only, with no Markdown.

          Video title: {candidate["title"]}
          Allowed primary_genre values: {", ".join(sorted(ALLOWED_GENRES))}
          """

              schema = {
                  "type": "object",
                  "properties": {
                      "primary_genre": {
                          "type": "string",
                          "enum": sorted(ALLOWED_GENRES),
                      },
                      "secondary_genres": {
                          "type": "array",
                          "items": {"type": "string"},
                      },
                      "format": {
                          "type": "string",
                          "enum": [
                              "Original",
                              "Cover",
                              "Remix",
                              "Live",
                              "Music video",
                              "Other",
                          ],
                      },
                      "language": {"type": "string"},
                      "mood": {
                          "type": "array",
                          "items": {"type": "string"},
                      },
                      "confidence": {
                          "type": "integer",
                          "minimum": 0,
                          "maximum": 100,
                      },
                      "reason": {"type": "string"},
                  },
                  "required": [
                      "primary_genre",
                      "secondary_genres",
                      "format",
                      "language",
                      "mood",
                      "confidence",
                      "reason",
                  ],
              }

              response = None
              for attempt in range(1, 5):
                  try:
                      response = gemini.models.generate_content(
                          model=os.environ.get("GEMINI_MODEL", "gemini-3.8-flash"),
                          contents=types.Content(
                              parts=[
                                  types.Part(
                                      file_data=types.FileData(file_uri=candidate["url"])
                                  ),
                                  types.Part(text=prompt),
                              ]
                          ),
                          config=types.GenerateContentConfig(
                              response_mime_type="application/json",
                              response_schema=schema,
                          ),
                      )
                      break
                  except errors.APIError as exc:
                      status_code = getattr(exc, "code", None)
                      retryable = (
                          status_code in {429, 500, 502, 503, 504}
                          or "UNAVAILABLE" in str(exc)
                      )
                      if not retryable or attempt == 4:
                          raise
                      wait_seconds = 15 * attempt
                      print(
                          f"Gemini temporary error for {candidate['video_id']} "
                          f"on attempt {attempt}/4; retrying in {wait_seconds}s."
                      )
                      time.sleep(wait_seconds)

              result = json.loads(response.text)
              if result.get("primary_genre") not in ALLOWED_GENRES:
                  result["primary_genre"] = "Other/Uncertain"
              return result

          def find_or_create_other_playlist(youtube, title):
              next_page_token = None
              while True:
                  response = youtube.playlists().list(
                      part="snippet,status",
                      mine=True,
                      maxResults=50,
                      pageToken=next_page_token,
                  ).execute()
                  for item in response.get("items", []):
                      if item.get("snippet", {}).get("title") == title:
                          playlist_id = item["id"]
                          print(f"Using existing non-Artcore playlist: {title} ({playlist_id})")
                          return playlist_id

                  next_page_token = response.get("nextPageToken")
                  if not next_page_token:
                      break

              body = {
                  "snippet": {
                      "title": title,
                      "description": (
                          "由 yt_list 測試 workflow 建立；收錄來源播放清單中非 Artcore 的影片。"
                      ),
                  },
                  "status": {"privacyStatus": "private"},
              }
              created = youtube.playlists().insert(
                  part="snippet,status",
                  body=body,
              ).execute()
              playlist_id = created["id"]
              print(f"Created private non-Artcore playlist: {title} ({playlist_id})")
              return playlist_id

          mode = required_env("MODE").lower()
          if mode not in {"dry-run", "production"}:
              raise RuntimeError("MODE must be dry-run or production")

          sample_size = parse_sample_size()
          source_playlist_id = required_env("SOURCE_PLAYLIST_ID")
          artcore_playlist_id = required_env("ARTCORE_PLAYLIST_ID")
          other_playlist_title = required_env("OTHER_PLAYLIST_TITLE")

          youtube = build_youtube_client()
          validate_playlist(youtube, artcore_playlist_id, "Artcore target")
          source_items = load_source_items(youtube, source_playlist_id)
          if len(source_items) < sample_size:
              raise RuntimeError(
                  f"Source playlist has only {len(source_items)} usable videos; need {sample_size}."
              )

          randomizer = random.SystemRandom()
          randomizer.shuffle(source_items)

          candidates = []
          for candidate in source_items:
              if len(candidates) >= sample_size:
                  break
              if is_video_in_playlist(
                  youtube,
                  artcore_playlist_id,
                  candidate["video_id"],
              ):
                  print(
                      f"Skipping already-present Artcore video: "
                      f"{candidate['title']} ({candidate['video_id']})"
                  )
                  continue
              candidates.append(candidate)

          if len(candidates) < sample_size:
              raise RuntimeError(
                  "Not enough unprocessed candidates remain after duplicate checks."
              )

          print(f"Mode: {mode}")
          print(f"Source playlist: {source_playlist_id}")
          print(f"Random sample size: {sample_size}")
          print("Selected videos:")
          for candidate in candidates:
              print(f"- {candidate['title']} | {candidate['url']}")

          gemini = genai.Client(api_key=required_env("GEMINI_API_KEY"))
          analysis_results = []

          print("Gemini classifications:")
          for candidate in candidates:
              result = classify_video(gemini, candidate)
              record = {**candidate, "classification": result}
              analysis_results.append(record)
              print(json.dumps(record, ensure_ascii=False, indent=2))

          if mode == "dry-run":
              print(
                  "DRY RUN ONLY: classifications were generated, "
                  "but no playlist was created or modified."
              )
              raise SystemExit(0)

          other_playlist_id = None
          destinations = []
          for record in analysis_results:
              classification = record["classification"]
              primary_genre = classification.get("primary_genre")
              if primary_genre == "Artcore":
                  target_id = artcore_playlist_id
                  target_label = "Artcore"
              else:
                  if other_playlist_id is None:
                      other_playlist_id = find_or_create_other_playlist(
                          youtube,
                          other_playlist_title,
                      )
                  target_id = other_playlist_id
                  target_label = other_playlist_title

              if is_video_in_playlist(youtube, target_id, record["video_id"]):
                  print(
                      f"Skipping duplicate in {target_label}: "
                      f"{record['title']} ({record['video_id']})"
                  )
                  continue

              destinations.append(
                  {
                      "playlist_id": target_id,
                      "playlist_label": target_label,
                      "video_id": record["video_id"],
                      "title": record["title"],
                      "url": record["url"],
                      "primary_genre": primary_genre,
                  }
              )

          for destination in destinations:
              youtube.playlistItems().insert(
                  part="snippet",
                  body={
                      "snippet": {
                          "playlistId": destination["playlist_id"],
                          "resourceId": {
                              "kind": "youtube#video",
                              "videoId": destination["video_id"],
                          },
                      }
                  },
              ).execute()
              print(
                  f"ADDED: {destination['title']} -> "
                  f"{destination['playlist_label']} "
                  f"({destination['playlist_id']})"
              )

          print(f"PRODUCTION COMPLETE: {len(destinations)} new playlist item(s) added.")
          PY
