name: Verify YouTube OAuth

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify YouTube OAuth
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google API libraries
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth

      - name: Test authenticated YouTube read access
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError

          required = [
              "YOUTUBE_CLIENT_ID",
              "YOUTUBE_CLIENT_SECRET",
              "YOUTUBE_REFRESH_TOKEN",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              print("Missing repository secrets: " + ", ".join(missing))
              sys.exit(1)

          try:
              credentials = Credentials(
                  token=None,
                  refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
                  token_uri="https://oauth2.googleapis.com/token",
                  client_id=os.environ["YOUTUBE_CLIENT_ID"],
                  client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
                  scopes=["https://www.googleapis.com/auth/youtube.force-ssl"],
              )

              youtube = build(
                  "youtube",
                  "v3",
                  credentials=credentials,
                  cache_discovery=False,
              )

              channel_response = youtube.channels().list(
                  part="snippet,contentDetails",
                  mine=True,
              ).execute()

              channels = channel_response.get("items", [])
              if not channels:
                  print("OAuth succeeded, but no YouTube channel was found.")
                  sys.exit(1)

              channel = channels[0]
              uploads_playlist_id = channel["contentDetails"]["relatedPlaylists"]["uploads"]

              upload_response = youtube.playlistItems().list(
                  part="snippet",
                  playlistId=uploads_playlist_id,
                  maxResults=5,
              ).execute()

              print("YouTube OAuth read test passed.")
              print(f"Channel: {channel['snippet']['title']}")
              print(f"Channel ID: {channel['id']}")
              print(f"Uploads playlist: {uploads_playlist_id}")
              print(f"Recent upload entries read: {len(upload_response.get('items', []))}")

          except HttpError as exc:
              status = getattr(exc.resp, "status", "unknown")
              print(f"YouTube API request failed (HTTP {status}).")
              print("Check the OAuth scope, refresh token, and YouTube Data API enablement.")
              sys.exit(1)
          except Exception as exc:
              print(f"OAuth test failed: {type(exc).__name__}: {exc}")
              sys.exit(1)
          PY
