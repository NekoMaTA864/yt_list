name: YoKaze Dry Run

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Optional public YouTube URL; leave blank to use the latest YoKaze upload"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze one YoKaze video
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      VIDEO_URL: ${{ inputs.video_url }}
      GEMINI_MODEL: gemini-3.8-flash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade google-api-python-client google-auth google-genai

      - name: Analyze latest YoKaze video
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.parse import parse_qs, urlparse

          from google import genai
          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from google.genai import types

          YOUTUBE_SCOPE = "https://www.googleapis.com/auth/youtube.force-ssl"
          CHANNEL_HANDLE = "@YoKaze"

          def require_env(name):
              value = os.environ.get(name, "").strip()
              if not value:
                  raise RuntimeError(f"Missing required GitHub secret or setting: {name}")
              return value

          def parse_video_url(raw_url):
              parsed = urlparse(raw_url)
              host = parsed.netloc.lower().split(":")[0]
              if host == "youtu.be":
                  video_id = parsed.path.strip("/").split("/")[0]
              elif host in {"youtube.com", "www.youtube.com", "m.youtube.com", "music.youtube.com"}:
                  video_id = parse_qs(parsed.query).get("v", [""])[0]
              else:
                  video_id = ""
              if not video_id or len(video_id) > 20:
                  raise ValueError("video_url must be a public YouTube watch URL")
              return f"https://www.youtube.com/watch?v={video_id}"

          client_id = require_env("YOUTUBE_CLIENT_ID")
          client_secret = require_env("YOUTUBE_CLIENT_SECRET")
          refresh_token = require_env("YOUTUBE_REFRESH_TOKEN")
          gemini_api_key = require_env("GEMINI_API_KEY")

          credentials = Credentials(
              token=None,
              refresh_token=refresh_token,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=client_id,
              client_secret=client_secret,
              scopes=[YOUTUBE_SCOPE],
          )
          credentials.refresh(Request())
          youtube = build("youtube", "v3", credentials=credentials, cache_discovery=False)

          manual_url = os.environ.get("VIDEO_URL", "").strip()
          if manual_url:
              video_url = parse_video_url(manual_url)
              video_title = "Manual test video"
              published_at = "unknown"
              source = "manual input"
          else:
              channel_response = youtube.channels().list(
                  part="snippet,contentDetails",
                  forHandle=CHANNEL_HANDLE,
              ).execute()
              channel_items = channel_response.get("items", [])
              if not channel_items:
                  raise RuntimeError(f"Could not find YouTube channel {CHANNEL_HANDLE}")
              channel = channel_items[0]
              uploads_playlist_id = channel["contentDetails"]["relatedPlaylists"]["uploads"]
              upload_response = youtube.playlistItems().list(
                  part="snippet,contentDetails",
                  playlistId=uploads_playlist_id,
                  maxResults=5,
              ).execute()
              upload_items = upload_response.get("items", [])
              if not upload_items:
                  raise RuntimeError("The YoKaze uploads playlist is empty")
              latest = upload_items[0]
              video_id = latest["snippet"]["resourceId"]["videoId"]
              video_url = f"https://www.youtube.com/watch?v={video_id}"
              video_title = latest["snippet"].get("title", "(untitled)")
              published_at = latest["snippet"].get("publishedAt", "unknown")
              channel_name = channel["snippet"].get("title", CHANNEL_HANDLE)
              source = f"{channel_name} latest upload"

          prompt = f"""
          Classify the music in this public YouTube video for a personal playlist.
          Use the supplied video (audio/video when available) and the title as evidence.
          Select exactly one primary_genre from the allowed values.
          Use Other/Uncertain and lower confidence when there is not enough evidence.
          A cover, remix, live performance, or music video is a format, not necessarily a genre.
          Keep secondary_genres and mood concise. Return JSON only, with no Markdown.

          Video title: {video_title}
          Allowed primary_genre values: J-pop, R&B, Artcore, Pop, Rock, Electronic, Hip-hop, Jazz, Classical, Other/Uncertain
          """

          schema = {
              "type": "object",
              "properties": {
                  "primary_genre": {
                      "type": "string",
                      "enum": [
                          "J-pop", "R&B", "Artcore", "Pop", "Rock",
                          "Electronic", "Hip-hop", "Jazz", "Classical",
                          "Other/Uncertain",
                      ],
                  },
                  "secondary_genres": {
                      "type": "array",
                      "items": {"type": "string"},
                  },
                  "format": {
                      "type": "string",
                      "enum": [
                          "Original", "Cover", "Remix", "Live",
                          "Music video", "Other",
                      ],
                  },
                  "language": {"type": "string"},
                  "mood": {
                      "type": "array",
                      "items": {"type": "string"},
                  },
                  "confidence": {
                      "type": "integer",
                      "minimum": 0,
                      "maximum": 100,
                  },
                  "reason": {"type": "string"},
              },
              "required": [
                  "primary_genre", "secondary_genres", "format",
                  "language", "mood", "confidence", "reason",
              ],
          }

          print(f"Source: {source}")
          print(f"Title: {video_title}")
          print(f"Published: {published_at}")
          print(f"URL: {video_url}")
          print(f"Model: {os.environ.get('GEMINI_MODEL', 'gemini-3.8-flash')}")

          gemini = genai.Client(api_key=gemini_api_key)
          response = gemini.models.generate_content(
              model=os.environ.get("GEMINI_MODEL", "gemini-3.8-flash"),
              contents=types.Content(parts=[
                  types.Part(file_data=types.FileData(file_uri=video_url)),
                  types.Part(text=prompt),
              ]),
              config=types.GenerateContentConfig(
                  response_mime_type="application/json",
                  response_schema=schema,
              ),
          )

          result = json.loads(response.text)
          print("Gemini classification:")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          print("DRY RUN ONLY: no playlist API write was called.")
          PY
